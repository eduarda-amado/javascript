<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Desconto</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
        button {
            padding: 22px;
        }
    </style>
</head>
<body>
    <h1>Calcular Desconto</h1>
    <button onclick="clicar()">Desconto de 10%</button>
    <p id="10">Clique no botão acima para iniciar.</p>

    <script>
        function clicar() {
            let prod = window.prompt('Qual é o produto que você está comprando?')
            let val = Number(window.prompt(`Qual é o preço do ${prod}`))
            
            let desconto = val * 0.10
            let novoValor = val - desconto

           document.getElementById('10').innerHTML = `<h2>Calculando desconto de 10% para ${prod}</h2> <br> 
           <p>O preço original era R$${val.toFixed(2)} <br> 
            Você acaba de ganhar R$${desconto.toFixed(2)} de desconto (-10%). <br> 
            No fim, você vai pagar R$${novoValor.toFixed(2)} no produto ${prod}. </p> `
        }
    </script>
</body>
</html>
