<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio boas-vindas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        button {
            padding: 22px;
        }
    </style>
</head>
<body>
    <h1>Boas-vindas</h1>
    <button onclick="clicou()">Inicie o desafio</button>

    <script>
        function clicou() {
            var name = window.prompt('Qual  é o seu nome?')
            var idade = window.prompt('Olá, ' + name + '! Quantos anos você tem?')
            window.alert(`Acabei de conhecer ${name}, que tem ${idade} anos de idade!`)
        }
    </script>
</body>
</html>
