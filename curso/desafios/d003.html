<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antes e Depois</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        button {
            padding: 22px;
        }
    </style>
</head>
<body>
    <h1>Antes e Depois</h1>
    <button onclick="clicar()">Antecessor e Sucessor</button>

    <script>
        function clicar() {
            let n1 = Number(window.prompt('Digite um número inteiro qualquer'));

            let antes = n1 - 1;
            let depois = n1 + 1;

            window.alert(`Antes de ${n1}, temos o número ${antes}. \nDepois de ${n1}, temos o número ${depois}`);
        }
    </script>
</body>
</html>
