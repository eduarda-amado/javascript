<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body {
            background-color: rgba(96, 64, 125, 0.577);
            color: white;
            font: normal 20px Arial;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Vel odio minus provident totam atque esse vero cupiditate recusandae. Repellendus velit voluptatibus quasi, doloremque amet ab omnis totam quae vel illo?</p>
    <script>
      var n1 = Number(window.prompt('Digite um número: ')) // string
      var n2 = Number(window.prompt('Digite outro número: ')) // string 
      var s = n1 + n2
      window.alert(`A soma entre ${n1} e ${n2} é ${s}`) // concatenação
      // (number + number) para adição
      // (string + string) para concatenação
    </script>
</body>
</html>
