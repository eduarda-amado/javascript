<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font: normal 20px Arial;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt('Qual é o seu nome?')
        document.write(`Seu nome tem ${nome.length} letras <br/>`) // quantos caracteres a string tem
        document.write(`Seu nome em maiúsculas é ${nome.toUpperCase()} <br/>`) // tudo para maiúsculas
        document.write(`Seu nome em minúsculas é ${nome.toLowerCase()}`) // tudo para minúsculas
    </script>
</body>
